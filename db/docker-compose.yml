services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: wow_forever_atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_only
    ports:
      - "5432:5432"
    volumes:
      - atlas_pg_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

volumes:
  atlas_pg_data:
